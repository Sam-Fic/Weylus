<!DOCTYPE html>
<html>

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="theme-color" content="#f6f2f9" media="(prefers-color-scheme: light)">
	<meta name="theme-color" content="#141218" media="(prefers-color-scheme: dark)">
	<title>Weylus</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<div class="container">
		<form class="login-card" action="/">
			<h1 class="login-title">Weylus</h1>
			<p class="login-subtitle">Enter the access code to continue.</p>
			<input type="text" id="access_code" name="access_code" placeholder="Access code" autocomplete="off"
				autocapitalize="off" autocorrect="off" spellcheck="false" required>
			<button type="submit">Login</button>
		</form>
	</div>
</body>

</html>
